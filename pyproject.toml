[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-translate"
version = "0.2.0"
description = "Resumable EPUB translation with the free Gemini web interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ebook-translate = "ebook_translate.cli:main"
ebook-translate-mcp = "ebook_translate.mcp:main"

[tool.setuptools.packages.find]
include = ["ebook_translate*"]
